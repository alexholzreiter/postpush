    <text y="78" fill="#ff6f47" font-family="Arial" font-size="70" font-weight="800" letter-spacing="-4">Every room.</text>
    <text y="137" fill="#9b9daa" font-family="Arial" font-size="22">Local announcements from Home Assistant to HomePods.</text>
    <g transform="translate(0 179)">
      <rect width="168" height="44" rx="13" fill="url(#orange)"/>
      <text x="84" y="28" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="750">OPEN SOURCE</text>
      <rect x="181" width="154" height="44" rx="13" fill="#2d2f3c" stroke="#454755"/>
      <text x="258" y="28" text-anchor="middle" fill="#d8d9df" font-family="Arial" font-size="14" font-weight="700">SELF-HOSTED</text>
    </g>
  </g>
  <g transform="translate(910 148)" filter="url(#shadow)">
