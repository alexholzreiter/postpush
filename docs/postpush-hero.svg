<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
  <title id="title">PostPush — New mail. Every room.</title>
  <desc id="desc">PostPush turns a mailbox event into a local announcement on HomePods.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131c"/><stop offset="1" stop-color="#232536"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff754b"/><stop offset="1" stop-color="#ef4625"/></linearGradient>
    <linearGradient id="mailbox" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4b5262"/><stop offset="1" stop-color="#20242e"/></linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#555c6d"/><stop offset="1" stop-color="#252a35"/></linearGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f0eb"/><stop offset="1" stop-color="#a7a49f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ff6940" stop-opacity=".28"/><stop offset="1" stop-color="#ff6940" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1440" height="580" rx="44" fill="url(#bg)"/>
  <circle cx="1110" cy="292" r="330" fill="url(#glow)"/>
  <circle cx="1110" cy="292" r="210" fill="none" stroke="#ff7450" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="1110" cy="292" r="270" fill="none" stroke="#8f7cff" stroke-opacity=".08" stroke-width="2"/>
  <g transform="translate(92 100)">
    <rect width="72" height="72" rx="21" fill="url(#orange)"/>
    <path d="M15 36c0-10 8-18 18-18h13c8 0 14 6 14 14v21H32c-9 0-17-7-17-17Z" fill="#fff"/>
    <path d="M25 15v33M25 15h18" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 38q8 7 0 14M57 32q15 13 0 26" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="98" y="33" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="800">PostPush</text>
    <text x="98" y="58" fill="#898b97" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">MAILBOX × HOMEPOD</text>
  </g>
  <g transform="translate(92 252)" font-family="Arial, sans-serif">
    <text fill="#fff" font-size="70" font-weight="800" letter-spacing="-4">New mail.</text>
    <text y="78" fill="#ff6f47" font-size="70" font-weight="800" letter-spacing="-4">Every room.</text>
    <text y="137" fill="#9b9daa" font-size="22">Local announcements from Home Assistant to HomePods.</text>
    <g transform="translate(0 179)">
      <rect width="168" height="44" rx="13" fill="url(#orange)"/>
      <text x="84" y="28" text-anchor="middle" fill="#fff" font-size="14" font-weight="750">OPEN SOURCE</text>
      <rect x="181" width="154" height="44" rx="13" fill="#2d2f3c" stroke="#454755"/>
      <text x="258" y="28" text-anchor="middle" fill="#d8d9df" font-size="14" font-weight="700">SELF-HOSTED</text>
    </g>
  </g>
  <!-- Same clean mailbox silhouette used on the project website. -->
  <g transform="translate(914 151)" filter="url(#shadow)">
    <path d="M36 174V93C36 42 77 1 128 1h94c51 0 92 41 92 92v116H71c-19 0-35-16-35-35Z" fill="url(#mailbox)" stroke="#6f7480" stroke-width="5"/>
    <path d="M77 38v137M77 38h74" fill="none" stroke="url(#orange)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="77" cy="170" r="7" fill="#ffe6de"/>
    <rect x="163" y="96" width="101" height="119" rx="9" fill="#e6bd78" transform="rotate(-6 214 156)"/>
    <path d="M139 130h132v91H139z" fill="#fff" transform="rotate(4 205 176)"/>
    <path d="m140 131 65 49 65-49" fill="#f0f1f4" stroke="#d9dae0" stroke-width="3" transform="rotate(4 205 176)"/>
    <path d="M91 209h197l58 50H143z" fill="url(#door)" stroke="#777d8b" stroke-width="7"/>
  </g>
  <g fill="none" stroke="#ff6d45" stroke-width="14" stroke-linecap="round"><path d="M1274 213q46 54 0 108"/><path d="M1316 178q88 90 0 178" opacity=".85"/><path d="M1355 145q126 124 0 244" opacity=".65"/></g>
  <g transform="translate(806 403)"><path d="M0 38a38 38 0 0 1 76 0v45H0Z" fill="url(#pod)"/><ellipse cx="38" cy="82" rx="25" ry="4" fill="#777" opacity=".4"/></g>
  <g transform="translate(1248 405)"><path d="M0 34a34 34 0 0 1 68 0v42H0Z" fill="url(#pod)"/><ellipse cx="34" cy="75" rx="22" ry="4" fill="#777" opacity=".4"/></g>
</svg>
