<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
  <title id="title">PostPush</title>
  <desc id="desc">A mailbox announcement bridge for HomePods</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131c"/><stop offset="1" stop-color="#232536"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7b4f"/><stop offset="1" stop-color="#ef4625"/></linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51586a"/><stop offset="1" stop-color="#20242e"/></linearGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1efe9"/><stop offset="1" stop-color="#aaa7a2"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ff6940" stop-opacity=".25"/><stop offset="1" stop-color="#ff6940" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1440" height="580" rx="44" fill="url(#bg)"/>
  <circle cx="1110" cy="292" r="330" fill="url(#glow)"/>
  <circle cx="1110" cy="292" r="210" fill="none" stroke="#ff7450" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="1110" cy="292" r="270" fill="none" stroke="#8f7cff" stroke-opacity=".08" stroke-width="2"/>
  <g transform="translate(92 105)">
    <rect width="78" height="78" rx="23" fill="#fff"/>
    <g transform="translate(12 17)">
      <path d="M8 16h38v27H8z" fill="url(#mail)"/>
      <path d="M27 16a19 19 0 0 1 19 19H8a19 19 0 0 1 19-19Z" fill="url(#mail)"/>
      <path d="M14 43h27l8 6H18z" fill="#333847"/>
      <path d="M14 12v26" stroke="url(#orange)" stroke-width="7" stroke-linecap="round"/>
      <path d="M14 12h17" stroke="url(#orange)" stroke-width="7" stroke-linecap="round"/>
      <path d="M50 20q8 7 0 14M55 15q15 12 0 24" fill="none" stroke="#ff6841" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="103" y="36" fill="#fff" font-family="Arial" font-size="27" font-weight="800">PostPush</text>
    <text x="103" y="61" fill="#898b97" font-family="Arial" font-size="15" font-weight="600" letter-spacing="1">MAILBOX × HOMEPOD</text>
  </g>
  <g transform="translate(92 252)">
