<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#f6f3ee;font-family:Inter,-apple-system,"SF Pro Text",sans-serif;color:#171822}
.glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(255,94,50,.20),rgba(255,94,50,0) 68%)}
.brand{position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:14px}

.c1{left:520px;top:104px}.c1 .ic{background:#fff0ea}.c1 svg{stroke:#ff5e32}
