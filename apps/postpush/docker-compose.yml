services:
  postpush:
    image: ghcr.io/alexholzreiter/postpush:0.2.14
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ}
      DATA_DIR: /data
      MEDIA_DIR: /data/media
      WEB_PORT: "8586"
      OWNTONE_URL: http://127.0.0.1:3689
      OWNTONE_MEDIA_PATH: /srv/media
      MQTT_URL: ${MQTT_URL}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC: ${MQTT_TOPIC}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/../../doorbell/ring-homepod-doorbell/data/media:/data/media
    x-runtipi:
      is_main: true
      internal_port: 8586
x-runtipi:
  schema_version: 2
