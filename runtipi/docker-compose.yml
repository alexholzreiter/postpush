services:
  postpush:
    image: ghcr.io/alexholzreiter/postpush:0.2.3
    restart: unless-stopped
    network_mode: host
    depends_on:
      owntone:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      DATA_DIR: /data
      MEDIA_DIR: /data/media
      WEB_PORT: "8586"
      OWNTONE_URL: http://127.0.0.1:3690
      OWNTONE_MEDIA_PATH: /srv/media
      MQTT_URL: ${MQTT_URL}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC: ${MQTT_TOPIC}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      is_main: true
      internal_port: 8586

  owntone:
    image: docker.io/owntone/owntone:29.3
    restart: unless-stopped
    network_mode: host
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/media /data/owntone-cache /data/owntone-config
        cat > /data/owntone-config/owntone.conf <<'OWNTONE_CONFIG'
        general {
          uid = "owntone"
          logfile = "/dev/stdout"
          loglevel = log
          trusted_networks = { "localhost" }
          ipv6 = no
          cache_dir = "/var/cache/owntone"
          speaker_autoselect = no
          start_buffer_ms = 1000
        }
        library {
          name = "PostPush"
          port = 3690
          directories = { "/srv/media" }
        }
        audio {
          nickname = "Disabled"
          type = "disabled"
        }
        mpd {
          port = 0
        }
        OWNTONE_CONFIG
        chmod 0644 /data/owntone-config/owntone.conf
        chown -R 1000:1000 /data/media /data/owntone-cache /data/owntone-config
        adduser -D -g owntone -h /dev/null -s /sbin/nologin owntone 2>/dev/null || true
        usermod -u 1000 owntone 2>/dev/null || true
        groupmod -g 1000 owntone 2>/dev/null || true
        rc-service dbus start
        rc-service avahi-daemon start
        exec /usr/sbin/owntone -f
    environment:
      UID: "1000"
      GID: "1000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/owntone-config:/etc/owntone:ro
      - ${APP_DATA_DIR}/data/media:/srv/media
      - ${APP_DATA_DIR}/data/owntone-cache:/var/cache/owntone
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3690/api/config >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

x-runtipi:
  schema_version: 2
